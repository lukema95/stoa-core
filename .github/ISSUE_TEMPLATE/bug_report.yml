name: Bug report
description: Report a reproducible bug in Stoa
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. See SECURITY.md.
        Security reports must be private. / 安全问题请勿使用本模板。
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include cluster, program ID, transaction signatures, and commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
