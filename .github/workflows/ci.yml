name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Solana platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-v1.52

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1

      - name: Prepare Solana environment
        run: |
          # Solana 2.x ships agave-install; some Anchor tooling still calls
          # solana-install. Create a compatibility symlink in CI.
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          ln -sf "$SOLANA_BIN/agave-install" "$SOLANA_BIN/solana-install"
          mkdir -p "$HOME/.cache/solana"
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent -o "$HOME/.config/solana/id.json"
          solana config set --url http://127.0.0.1:8899

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation pairing
        run: ./scripts/check-docs.sh

      - name: Build program
        run: anchor build

      - name: Run Rust unit tests
        run: cargo test -p stoa

      - name: Check program ID consistency
        run: ./scripts/check-program-id.sh

      - name: Run tests
        run: anchor test --skip-build --validator legacy
